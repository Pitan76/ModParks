name = "modparks"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# カスタムワーカースクリプト (Cron 対応のため OpenNext の worker をラップ)
main = "worker-wrapper.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[triggers]
# 式は worker-wrapper.js の scheduled() が見る定数と一致させること
crons = [
  "0 * * * *", # 毎時0分: 外部サービスとの同期
  "0 3 * * *", # 毎日 03:00 UTC: 自動バックアップ
  # 5分ごと: DDoS自動解除とスライス取り込み、HTMLキャッシュの温めを交互に行う。
  # 交互にするのは起動ごとのCPU予算を分けるため (worker-wrapper.js の TICK_CRON)
  "*/5 * * * *",
  "30 3 * * *", # 毎日 03:30 UTC: 信頼ポイントの加点同期と再計算
  "45 3 * * *", # 毎日 03:45 UTC: 古い通知の掃除
]

[[d1_databases]]
binding        = "DB"
database_name  = "modparks-db"
database_id = "7a0b941a-b8f4-47b7-97fb-428a126c96a2"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "75c45e724c144cc18b629dd2dca50a7e"

# JAR 解析サイドカー。jszip はこちらにのみ存在する。
# 分離の理由はバンドルサイズではなく本体の isolate 起動 CPU。Free は 1 リクエスト
# 10 ms しかないため、JAR 解析を使わない要求に jszip の評価を負担させない。
# （圧縮後 3 MiB の上限は 2026-09-04 に撤廃され、現在は非圧縮 64 MiB で Free/Paid 共通）
[[services]]
binding = "JAR"
service = "modparks-jar"

# WebAuthn 検証サイドカー。@simplewebauthn/server はこちらにのみ存在する。
# 上の JAR と同じ理由で、サイズではなく isolate 起動 CPU のために分離している。
[[services]]
binding = "AUTH"
service = "modparks-auth"

# Web Push 配送サイドカー。aes128gcm 暗号化 + VAPID 署名を Web Crypto で実行する
# （web-push npm は Node crypto 依存で Workers では動かないため隔離）
[[services]]
binding = "PUSH"
service = "modparks-push"

[[r2_buckets]]
bucket_name = "modparks-storage"
binding = "modparks_storage"

# 静的スナップショットの公開専用バケット。archive.modparks.pitan76.net を接続する。
# ファイル配信用と分けているのは、R2 のカスタムドメインがバケット全体を公開するため。
# 公開専用にしておけば「置いたものは全部公開」が前提になり、誤配置の余地が消える。
[[r2_buckets]]
bucket_name = "modparks-static"
binding = "modparks_static"
# binding     = "R2"
# bucket_name = "modparks-files"

[images]
binding = "IMAGES"

# デプロイごとに変わるバージョン ID。HTML キャッシュのキーに含め、前のビルドの
# HTML を配らないようにする（worker/html-key.js の setCacheGeneration を参照）
[version_metadata]
binding = "CF_VERSION_METADATA"

# 説明文の AI 翻訳。外部 API キーを持たずに済むため Workers AI を使う。
# プロバイダを変える場合は TRANSLATION_PROVIDER と providers/ の実装を差し替える。
[ai]
binding = "AI"

# ─── 環境変数 ─────────────────────────────────────────────────────────────────
[vars]
NEXTAUTH_URL       = "https://modparks.pitan76.net"
AUTH_URL           = "https://modparks.pitan76.net"
AUTH_TRUST_HOST    = "true"
NEXT_PUBLIC_APP_URL = "https://modparks.pitan76.net"
NEXT_PUBLIC_RECIPE_CDN_URL = "https://recipe.modparks.pitan76.net"
USE_RECIPE_CDN_API = "true"
GITHUB_CONFIG_REPO = "Pitan76/ModParks"
# Web Push の VAPID 公開鍵（base64url）。クライアントの購読にも使うため公開してよい。
# 秘密鍵とサブジェクトは秘匿値: `wrangler secret put VAPID_PRIVATE_KEY` / `VAPID_SUBJECT`
# 鍵ペアは `node scripts/generate-vapid.mjs` で生成する。
NEXT_PUBLIC_VAPID_PUBLIC_KEY = "BF-bDjyywR9aPnv3tY_CqAyonXqq0qBPvkt0Ycr5NSoBXVJOR_P6FznPIVd4sdoV3E1LhcngfMI0nBnzezsTDhE"
VAPID_PUBLIC_KEY = "BF-bDjyywR9aPnv3tY_CqAyonXqq0qBPvkt0Ycr5NSoBXVJOR_P6FznPIVd4sdoV3E1LhcngfMI0nBnzezsTDhE"
CLOUDFLARE_ACCOUNT_ID = "70a9b16c9396a3ab84c4ce7719800373"
# R2 公開URL。これを設定すると画像/アイコン/mod の配信が R2 エッジ直になり、
# /api/r2 プロキシ（Worker 経由）を通らなくなる＝Worker の継続負荷が消える。
# modparks-storage バケットに接続したカスタムドメイン（Cloudflare CDN キャッシュ対象）。
R2_PUBLIC_URL = "https://files.modparks.pitan76.net"
# 上と同じ値。クライアント側のサムネイルURL組み立て(lib/utils/imageUrl.ts)で参照する。
# NEXT_PUBLIC_* はビルド時にバンドルへ焼き込まれるため、変更後は再ビルドが必要。
NEXT_PUBLIC_R2_PUBLIC_URL = "https://files.modparks.pitan76.net"
# Cloudflare Image Transformations(/cdn-cgi/image/)でサムネイルを配信するか: on / off
# 課金は「その月に要求された(画像,幅)の種類数」で決まりアクセス数には比例しない。
# 無料枠は月5,000変換。幅は lib/utils/imageUrl.ts の ALLOWED_WIDTHS に固定している。
# 超過時は onerror=redirect により原寸配信へ落ちるので、画像が壊れることはない。
NEXT_PUBLIC_IMAGE_TRANSFORM = "on"
# 広告枠の表示モード: off / preview(位置のみ) / on(実配信)
NEXT_PUBLIC_ADS_MODE = "on"
# AdSense のパブリッシャーID。HTML に出る公開値なので秘匿不要。
# 未設定だと ADS_MODE=on でも全枠が非表示になる。
# 広告ユニットID は lib/config/ads.ts の AD_SLOT_IDS で管理。
NEXT_PUBLIC_ADSENSE_CLIENT = "ca-pub-3977024448605477"
GITHUB_APP_SLUG = "modparks"

# API を Worker へ切り出した効果を測るために有効化している。
# invocation_logs に CPU 時間と Wall 時間が載るので、Query Builder で
# パスごとの p90 CPU を出して modparks-api と比較する。
# Free は 1 日 20 万イベント・3 日保持まで追加費用なし。使い切ると
# その日のログが落ちるだけで課金はされないが、朝の分だけが残って
# 標本が偏るため、足りなければ head_sampling_rate を下げること。
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
