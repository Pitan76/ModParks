<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 本体サイトと内容が重複するため、検索結果で競合させない -->
<meta name="robots" content="noindex, nofollow">
<!--
  データの配信元。Worker を通さない経路を指すこと。
  archive ホストから開いたときは同一オリジンの相対パスを使う（app.js が判定する）。
-->
<meta name="mp-data-origin" content="https://archive.modparks.pitan76.net">
<title>ModParks Archive</title>
<link rel="icon" href="./icon.svg">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<header class="appbar">
  <button id="menu" class="icon-btn menu-btn" type="button" aria-label="menu">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </button>

  <a class="brand" href="#/">
    <img class="brand-logo" src="./icon.svg" alt="ModParks">
    <span class="brand-name">ModParks</span>
  </a>

  <span class="brand-tag">Archive</span>

  <div class="spacer"></div>

  <button id="theme-toggle" class="icon-btn theme-toggle-btn" type="button" aria-label="theme toggle">
    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zm-12.37 12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41z"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
  </button>
</header>

<div class="shell">
  <aside id="sidebar" class="sidebar">
    <nav class="nav">
      <a class="nav-item" data-route="list" href="#/">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span id="navHome"></span>
      </a>
      <a class="nav-item" data-route="projects" href="#/">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
        <span id="navProjects"></span>
      </a>
    </nav>
    <p id="sidebarNote" class="sidebar-note"></p>
  </aside>

  <main class="main">
    <p id="notice" class="notice" hidden></p>
    
    <div class="explore-header">
      <h1 id="exploreTitle" class="explore-title"></h1>
      <p id="exploreDesc" class="explore-desc"></p>
    </div>

    <div class="search-bar-section">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
        <input id="q" class="search-input" type="search" autocomplete="off">
      </div>
      
      <div class="filter-controls">
        <label class="filter-control-item">
          <span id="filterTypeLabel" class="filter-label"></span>
          <select id="filter-type" class="select">
            <option value="" id="filterTypeAll"></option>
            <option value="mod" id="filterTypeMod"></option>
            <option value="plugin" id="filterTypePlugin"></option>
            <option value="resourcepack" id="filterTypeResourcepack"></option>
            <option value="datapack" id="filterTypeDatapack"></option>
            <option value="shader" id="filterTypeShader"></option>
            <option value="modpack" id="filterTypeModpack"></option>
            <option value="other" id="filterTypeOther"></option>
          </select>
        </label>
        
        <label class="filter-control-item">
          <span id="sortLabel" class="filter-label"></span>
          <select id="sort" class="select">
            <option value="updated"></option>
            <option value="downloads"></option>
            <option value="newest"></option>
          </select>
        </label>
      </div>
    </div>

    <div class="toolbar">
      <span id="resultCount" class="result-count"></span>
    </div>

    <div id="view" class="view"></div>
    <nav id="pager" class="pager" hidden></nav>

    <footer class="foot">
      <span id="generated"></span>
      <a id="mainSite" href="https://modparks.pitan76.net"></a>
    </footer>
  </main>
</div>

<script src="./app.js"></script>
</body>
</html>
