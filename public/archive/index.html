<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 本体サイトと内容が重複するため、検索結果で競合させない -->
<meta name="robots" content="noindex, nofollow">
<!--
  データの配信元。Worker を通さない経路を指すこと。
  archive ホストから開いたときは同一オリジンの相対パスを使う（app.js が判定する）。
-->
<meta name="mp-data-origin" content="https://archive.modparks.pitan76.net">
<title>ModParks Archive</title>
<link rel="icon" href="./icon.svg">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<header class="appbar">
  <button id="menu" class="icon-btn menu-btn" type="button" aria-label="menu">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </button>

  <a class="brand" href="#/">
    <img class="brand-logo" src="./icon.svg" alt="ModParks">
    <span class="brand-name">ModParks</span>
  </a>

  <span class="brand-tag">Archive</span>

  <div class="spacer"></div>

  <input id="q" class="search" type="search" autocomplete="off">
</header>

<div class="shell">
  <aside id="sidebar" class="sidebar">
    <nav class="nav">
      <a class="nav-item" data-route="list" href="#/">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span id="navHome"></span>
      </a>
      <a class="nav-item" data-route="projects" href="#/">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
        <span id="navProjects"></span>
      </a>
    </nav>
    <p id="sidebarNote" class="sidebar-note"></p>
  </aside>

  <main class="main">
    <p id="notice" class="notice" hidden></p>
    <div class="toolbar">
      <span id="resultCount" class="result-count"></span>
      <label class="sort">
        <span id="sortLabel" class="sort-label"></span>
        <select id="sort" class="select">
          <option value="updated"></option>
          <option value="downloads"></option>
          <option value="newest"></option>
        </select>
      </label>
    </div>

    <div id="view" class="view"></div>
    <nav id="pager" class="pager" hidden></nav>

    <footer class="foot">
      <span id="generated"></span>
      <a id="mainSite" href="https://modparks.pitan76.net"></a>
    </footer>
  </main>
</div>

<script src="./app.js"></script>
</body>
</html>
