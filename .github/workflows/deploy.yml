name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_jar:
        description: "JAR workerも強制デプロイする"
        type: boolean
        default: false
      deploy_auth:
        description: "auth workerも強制デプロイする"
        type: boolean
        default: false
      deploy_push:
        description: "push workerも強制デプロイする"
        type: boolean
        default: false

jobs:
  # 型チェックは next build から外してあるため、ここで担保する。
  # deploy とは needs で繋がず並列に流す。直列にすると分離した意味が無くなるので、
  # 「型エラーはデプロイ後に赤で気付く」ことを許容する代わりにデプロイを待たせない。
  typecheck:
    runs-on: ubuntu-latest
    name: Typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # tsconfig の incremental: true が出力する .tsbuildinfo を跨いで再利用する
      - name: Restore TypeScript build info
        uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.sha }}
          restore-keys: tsbuildinfo-

      - name: Typecheck
        run: npm run typecheck

  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 各ターゲットに変更があるかを判定する
      # main は workers/jar, workers/auth, workers/push 以外に変更があった場合のみ（バインドは名前参照のため）
      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            jar:
              - "workers/jar/**"
            auth:
              - "workers/auth/**"
            push:
              - "workers/push/**"
            main:
              - "**"
              - "!workers/jar/**"
              - "!workers/auth/**"
              - "!workers/push/**"

      - name: Setup Node.js
        if: steps.changes.outputs.main == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.main == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # webpack のモジュールキャッシュ（.next/cache/webpack）を跨いで再利用する。
      # ソースが変わればキーは外れるが restore-keys で前回分を土台にできる。
      - name: Restore Next.js build cache
        if: steps.changes.outputs.main == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'db/**') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-
            next-

      - name: Build OpenNext
        if: steps.changes.outputs.main == 'true' || github.event_name == 'workflow_dispatch'
        run: npx opennextjs-cloudflare build
        env:
          # デプロイ間で Server Action の暗号鍵を固定する（ビルド時に焼き込まれる）
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          # Turbopack だと Server バンドルが 3 MiB を超えるため CI では webpack ビルドを使う
          CF_WEBPACK_BUILD: "1"

      # メイン Worker が Service Binding するため、先にサイドカーを配置する
      # サイドカー自体に変更があったときだけ再デプロイする（それ以外は既存のものを再利用）
      - name: Deploy JAR worker
        if: steps.changes.outputs.jar == 'true' || inputs.deploy_jar == true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          workingDirectory: workers/jar
          command: deploy

      # auth worker（独立サイドカー）。変更があったときだけデプロイする
      - name: Deploy auth worker
        if: steps.changes.outputs.auth == 'true' || inputs.deploy_auth == true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          workingDirectory: workers/auth
          command: deploy

      # push worker
      # 本体が Service Binding するため、本体をデプロイする回は必ず先に用意する
      # （未作成だと binding 解決に失敗するため main 変更時も無条件で流す＝ブートストラップ兼冪等）
      - name: Deploy push worker
        if: steps.changes.outputs.push == 'true' || steps.changes.outputs.main == 'true' || github.event_name == 'workflow_dispatch' || inputs.deploy_push == true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          workingDirectory: workers/push
          command: deploy

      # 本体（ModParks）。本体側に変更があったとき、または手動実行時にデプロイする
      - name: Deploy to Cloudflare
        if: steps.changes.outputs.main == 'true' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.100.0"
          # --minify で本体 Worker を圧縮する。webpack(no minify) では gzip 約 3,068 KiB と
          # 3 MiB 上限まで残り数 KiB しかないため、minify で約 2,712 KiB まで落として余裕を確保する。
          command: deploy --minify
