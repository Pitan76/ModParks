services:
  # next dev 専用。wrangler CLI は Bun で動かないためホスト側で実行する
  web:
    build: .
    ports: ["3000:3000"]
    environment:
      # Windows ホストの bind mount では inotify が届かないためポーリングで監視する
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/modparks
      - node_modules:/modparks/node_modules
      - next_cache:/modparks/.next

volumes: { node_modules: , next_cache: }
